plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}


repositories {
    maven {
        url "https://maven.neoforged.net/releases/"
        content {
            includeGroupAndSubgroups "net.neoforged"
            includeGroupAndSubgroups "cpw.mods"
        }
    }

    maven {
        url "https://thedarkcolour.github.io/KotlinForForge/"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    //modImplementation "dev.emi:emi-neoforge:${rootProject.emi_version}+${rootProject.minecraft_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${rootProject.minecraft_version}+build.${rootProject.yarn_mappings}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$project.yarn_mappings_patch_neoforge_version")
    }

    modImplementation "me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}+neoforge"
    //modCompileOnly "maven.modrinth:mcdx:${rootProject.mcdx_version}"
}

publishMods {
    displayName = "[NeoForge ${rootProject.minecraft_version}] ${rootProject.mod_version}"
    version = "neoforge-${project.version}"
    modLoaders.add("neoforge")
}

processResources {
    def resourceTargets = [:]
    project.properties.each { key, value ->
        if (value instanceof String) {
            resourceTargets.put(key, value)
        }
    }

    resourceTargets.put("custom_meta", [
            // Minecraft Information
            "minecraft_version": project.minecraft_version,
            //"minecraft_version_range": project.minecraft_version_range,
            "enabled_platforms": project.enabled_platforms,

            // Mod Information
            "license": project.license,
            "modId": project.archives_base_name,
            "version": project.mod_version,
            "mod_name": project.mod_name,
            "credits": project.credits,
            "authors": project.mod_author,
            "description": project.description,
            "maven_group": project.maven_group,

            // Loader Information
            "neoforge_version": project.neoforge_version,
            "neoforge_loader_version_range": project.neoforge_loader_version_range,

            // Mappings Information
            "yarn_mappings": project.yarn_mappings
    ])

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(resourceTargets)
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}